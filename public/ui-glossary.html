    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .demo-box {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      height: 150px;
      position: relative;
      overflow: hidden;
    }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .skeleton-anim { animation: pulse-fast 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes float-up {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .fab-anim { animation: float-up 1.8s ease-in-out infinite; }
    @keyframes slide-up-sheet {
      0%, 15% { transform: translateY(100%); }
      35%, 80% { transform: translateY(0%); }
      95%, 100% { transform: translateY(100%); }
    }
    .sheet-anim { animation: slide-up-sheet 4s ease-in-out infinite; }
    @keyframes toast-pop {
      0%, 15% { transform: translate(-50%, 24px); opacity: 0; }
      25%, 75% { transform: translate(-50%, 0px); opacity: 1; }
      85%, 100% { transform: translate(-50%, -10px); opacity: 0; }
    }
    .toast-anim { animation: toast-pop 3.5s ease-in-out infinite; }
    @keyframes drawer-slide {
      0%, 15% { transform: translateX(-100%); }
      35%, 75% { transform: translateX(0%); }
      90%, 100% { transform: translateX(-100%); }
    }
    .drawer-anim { animation: drawer-slide 4s ease-in-out infinite; }
    @keyframes wave-bar {
      0%, 100% { height: 6px; }
      50% { height: 24px; }
    }
    .wave-1 { animation: wave-bar 0.7s ease-in-out infinite; }
    .wave-2 { animation: wave-bar 0.5s ease-in-out infinite 0.1s; }
    .wave-3 { animation: wave-bar 0.8s ease-in-out infinite 0.2s; }
    .wave-4 { animation: wave-bar 0.6s ease-in-out infinite 0.3s; }

    let currentCategory = 'all';

    function renderCards() {
      const grid = document.getElementById('glossaryGrid');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = terms.filter(t => {
        const matchCat = currentCategory === 'all' || t.cat === currentCategory;
        const matchQuery = !query ||
          t.ko.toLowerCase().includes(query) ||
          t.en.toLowerCase().includes(query) ||
          t.desc.toLowerCase().includes(query) ||
          t.example.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      grid.innerHTML = filtered.map(t => `
        <article class="bg-slate-900 border ${t.cat === 'zeye' ? 'border-amber-500/40' : 'border-slate-800'} hover:border-indigo-500 rounded-2xl overflow-hidden flex flex-col justify-between transition-all shadow-lg">
          <div>
            <div class="demo-box">
              ${t.demo}
              <span class="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-bold ${t.cat === 'zeye' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900/90 text-indigo-300 border border-slate-700'} rounded">
                #${t.id} ${t.catName}
              </span>
            </div>
            <div class="p-3.5">
              <h2 class="text-sm font-extrabold text-white">${t.ko}</h2>
              <p class="text-[10px] text-indigo-400 font-medium mb-1.5">${t.en}</p>
              <p class="text-xs text-slate-300 leading-relaxed">${t.desc}</p>
            </div>
          </div>
          <div class="px-3.5 pb-3.5 pt-2 border-t border-slate-800/80 bg-slate-950/40">
            <div class="text-[11px] text-emerald-300 bg-emerald-950/40 border border-emerald-500/30 rounded-lg p-2 mb-2 leading-snug">
              🗣️ <b>노션 제보 예시:</b><br/>"${t.example}"
            </div>
            <div class="flex gap-1.5">
              <button onclick="copyText('${t.ko}')" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold transition">
                📌 명칭 복사
              </button>
              <button onclick="copyText('${t.example}')" class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition">
                📋 예시 문장 복사
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-btn active px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white';
        } else if (btn.dataset.cat === 'zeye') {
          btn.className = 'cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30';
        } else {
          btn.className = 'cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700';
        }
      });
      renderCards();
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      const toast = document.getElementById('copyToast');
      toast.textContent = `✅ 복사됨: "${text}" (노션에 Ctrl+V 하세요)`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    document.getElementById('searchInput').addEventListener('input', renderCards);
    renderCards();
  </script>
