      background-color: #f8fafc;
      color: #0f172a;
    }
    .demo-box {
      background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
      border-bottom: 1px solid #e2e8f0;
      height: 158px;

      background: linear-gradient(145deg, #fffbeb, #fef3c7);

    }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .skeleton-anim { animation: pulse-fast 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes float-up {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .fab-anim { animation: float-up 1.8s ease-in-out infinite; }
    @keyframes slide-up-sheet {
      0%, 15% { transform: translateY(100%); }
      35%, 80% { transform: translateY(0%); }
      95%, 100% { transform: translateY(100%); }
    }
    .sheet-anim { animation: slide-up-sheet 4s ease-in-out infinite; }
    @keyframes toast-pop {
      0%, 15% { transform: translate(-50%, 24px); opacity: 0; }
      25%, 75% { transform: translate(-50%, 0px); opacity: 1; }
      85%, 100% { transform: translate(-50%, -10px); opacity: 0; }
    }
    .toast-anim { animation: toast-pop 3.5s ease-in-out infinite; }
    @keyframes drawer-slide {
      0%, 15% { transform: translateX(-100%); }
      35%, 75% { transform: translateX(0%); }
      90%, 100% { transform: translateX(-100%); }
    }
    .drawer-anim { animation: drawer-slide 4s ease-in-out infinite; }
    @keyframes wave-bar {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    .wave-1 { animation: wave-bar 0.7s ease-in-out infinite; }
    .wave-2 { animation: wave-bar 0.5s ease-in-out infinite 0.1s; }
    .wave-3 { animation: wave-bar 0.8s ease-in-out infinite 0.2s; }

        example: '모바일에서 사진 [썸네일 그리드 카드]들의 높이가 서로 안 맞고 삐뚤빼뚤해요.',
        demo: `
          <div class="w-full h-full flex items-center justify-center gap-2 px-3">
            <div class="bg-white border border-slate-300 rounded-xl p-2 w-24 text-center shadow-xs">
              <div class="w-full h-10 bg-indigo-100 rounded mb-1 flex items-center justify-center text-sm">🏞️</div>
              <div class="text-[9px] font-bold text-slate-700">썸네일 카드 1</div>
            </div>
            <div class="bg-white border border-slate-300 rounded-xl p-2 w-24 text-center shadow-xs">
              <div class="w-full h-10 bg-emerald-100 rounded mb-1 flex items-center justify-center text-sm">👨‍👩‍👧</div>
              <div class="text-[9px] font-bold text-slate-700">썸네일 카드 2</div>
            </div>
          </div>`
      },
      {
        id: 28,
        cat: 'layout',
        catName: '화면·여백·로딩',
        ko: '말줄임표(...) & 글씨 넘침(Overflow)',
        en: 'Text Overflow / Ellipsis',
        desc: '제목이 길 때 상자 밖으로 글씨가 삐져나가지(Overflow) 않게 끝을 "..."(말줄임표)으로 깔끔하게 줄여주는 처리입니다.',
        example: '파일 이름이 길 때 "..." 처리가 안 되고 카드 밖으로 글씨가 [삐져나가요(Overflow)].',
        demo: `
          <div class="w-full h-full flex flex-col items-center justify-center gap-2 px-4">
            <div class="w-44 bg-rose-50 border border-rose-400 text-rose-800 font-bold rounded px-2 py-1 text-[10px] whitespace-nowrap">
              ❌ 글씨가 상자 밖으로 막 삐져나감!!
            </div>
            <div class="w-44 bg-emerald-50 border border-emerald-400 text-emerald-800 font-bold rounded px-2 py-1 text-[10px] truncate">
              ⭕ 긴 제목은 말줄임표로 깔끔하게...
            </div>
          </div>`
      },
      {
        id: 29,
        cat: 'layout',
        catName: '화면·여백·로딩',
        ko: '스켈레톤 & 스피너 (무한 로딩)',
        en: 'Skeleton UI & Loading Spinner',
        desc: '화면을 불러올 때 반짝이는 회색 뼈대(스켈레톤)나 빙글빙글 도는 동그라미(스피너)입니다. 계속 안 끝나면 무한 로딩 버그입니다.',
        example: '검색 버튼을 눌렀는데 [로딩 스피너]만 계속 돌고 결과 화면이 안 나와요(무한 로딩).',
        demo: `
          <div class="w-full h-full flex items-center justify-center gap-4 px-4">
            <div class="w-7 h-7 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin shrink-0"></div>
            <div class="flex-1 bg-white p-2.5 rounded-xl border border-slate-200 space-y-2 shadow-xs">
              <div class="skeleton-anim h-3 bg-slate-300 rounded w-full"></div>
              <div class="skeleton-anim h-2.5 bg-slate-200 rounded w-2/3"></div>
            </div>
          </div>`
      },
      {
        id: 30,
        cat: 'layout',
        catName: '화면·여백·로딩',
        ko: '빈 상태 안내 화면 (Empty State)',
        en: 'Empty State',
        desc: '사진이나 검색 결과가 0건일 때 하얀 백지 대신 "아직 등록된 사진이 없습니다"라고 친절히 안내하는 화면입니다.',
        example: '사진이 없는 방에 들어갔을 때 안내 문구([빈 상태 화면]) 없이 그냥 하얀 백지만 나와서 고장 난 줄 알았어요.',
        demo: `
          <div class="w-full h-full flex flex-col items-center justify-center text-center p-2">
            <div class="bg-white border border-slate-200 rounded-xl px-5 py-2.5 shadow-xs">
              <div class="text-xl mb-0.5">📭</div>
              <div class="text-xs font-extrabold text-slate-700">일치하는 사진이 없습니다</div>
              <div class="text-[10px] text-slate-400">다른 검색어를 입력해 보세요</div>
            </div>
          </div>`
      }
    ];

    let currentCategory = 'all';

    function renderCards() {
      const grid = document.getElementById('glossaryGrid');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = terms.filter(t => {
        const matchCat = currentCategory === 'all' || t.cat === currentCategory;
        const matchQuery = !query ||
          t.ko.toLowerCase().includes(query) ||
          t.en.toLowerCase().includes(query) ||
          t.desc.toLowerCase().includes(query) ||
          t.example.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      grid.innerHTML = filtered.map(t => `
        <article class="bg-white border-2 ${t.cat === 'ghosti' ? 'border-amber-300 hover:border-amber-500' : 'border-slate-200 hover:border-indigo-500'} rounded-2xl overflow-hidden flex flex-col justify-between transition-all shadow-sm hover:shadow-md">
          <div>
            <div class="demo-box ${t.cat === 'ghosti' ? 'demo-box-ghosti' : ''}">
              ${t.demo}
              <span class="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-extrabold ${t.cat === 'ghosti' ? 'bg-amber-500 text-white shadow-xs' : 'bg-white/95 text-indigo-700 border border-indigo-200 shadow-xs'} rounded-md">
                #${t.id} ${t.catName}
              </span>
            </div>
            <div class="p-4">
              <h2 class="text-sm md:text-[15px] font-extrabold text-slate-900">${t.ko}</h2>
              <p class="text-[11px] text-indigo-600 font-semibold mb-1.5">${t.en}</p>
              <p class="text-xs text-slate-600 leading-relaxed">${t.desc}</p>
            </div>
          </div>
          <div class="px-4 pb-4 pt-2.5 border-t border-slate-100 bg-slate-50/70">
            <div class="text-[11px] text-emerald-900 bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 mb-2.5 leading-snug">
              🗣️ <b class="text-emerald-700">노션 제보 예시:</b><br/>"${t.example}"
            </div>
            <div class="flex gap-1.5">
              <button onclick="copyText('${t.ko}')" class="flex-1 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-xl text-xs font-extrabold transition shadow-2xs">
                📌 용어만 복사
              </button>
              <button onclick="copyText('${t.example}')" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-extrabold transition shadow-xs">
                📋 예시 문장 복사
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-btn active px-3 py-2 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm';
        } else if (btn.dataset.cat === 'ghosti') {
          btn.className = 'cat-btn px-3 py-2 rounded-xl text-xs font-extrabold bg-amber-50 text-amber-800 border border-amber-300 hover:bg-amber-100';
        } else {
          btn.className = 'cat-btn px-3 py-2 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-200 hover:bg-slate-100';
        }
      });
      renderCards();
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      const toast = document.getElementById('copyToast');
      toast.textContent = `✅ 복사됨: "${text}" (노션에 Ctrl+V 하세요)`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    document.getElementById('searchInput').addEventListener('input', renderCards);
    renderCards();
  </script>
</body>
</html>
