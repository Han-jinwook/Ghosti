<body>

<header>

    <p id="subGuideText">🎯 정식 출시 D-Day: <b>2026-12-17 (천덕황도일 · 손 없는 날)</b> | 국내 Wave 1~4 파도타기 오픈 & 글로벌(Ghosti AI · Paddle $) 병행 로드맵</p>
  </div>
  <div class="header-right">
    <div class="legend">
      <span>🎨 <b>초기 단계 색상:</b></span>
      <span class="legend-item lg-w1">1단계</span>
      <span class="legend-item lg-w2">2단계</span>
      <span class="legend-item lg-w3">3단계</span>
      <span class="legend-item lg-w4">4단계</span>
    </div>
    <span id="saveStatus" class="status-pill pill-viewer">동기화 중...</span>
  </div>
</header>

<div class="matrix-wrapper">
  <table id="matrixTable" class="matrix"></table>
</div>

<script>
const IS_EDITOR = false;
let boardData = null;
let lastUpdatedAt = null;
let draggedCardId = null;

const STAGE_NAMES = {
  wave1: "1단계",
  wave2: "2단계",
  wave3: "3단계",
  wave4: "4단계",
  pool: "여유함"
};

function updateStatusPill(msg) {
  const pill = document.getElementById('saveStatus');
  if (!pill) return;
  if (IS_EDITOR) {
    pill.className = 'status-pill pill-editor';
    pill.textContent = msg || '✏️ 마스터 편집 모드 (드래그·클릭 즉시 저장)';
  } else {
    pill.className = 'status-pill pill-viewer';
    pill.textContent = msg || '👀 사내 열람 모드 (실시간 자동 동기화)';
  }
}

async function fetchBoard(silent = false) {
  const data = window.__INITIAL_BOARD_DATA__;
  if (silent && lastUpdatedAt && data.updated_at === lastUpdatedAt) {
    return;
  }
  boardData = data;
  lastUpdatedAt = data.updated_at;
  renderMatrix();
  updateStatusPill();
}

async function saveBoard() {
  if (!IS_EDITOR) return;
  updateStatusPill('⏳ 저장 중...');
  boardData.updated_at = new Date().toLocaleString('ko-KR');
  lastUpdatedAt = boardData.updated_at;
  await fetch('/api/state' + window.location.search, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(boardData)
  });
  updateStatusPill('✅ 자동 저장됨 (' + new Date().toLocaleTimeString('ko-KR') + ')');
}

function renderMatrix() {
  const tableEl = document.getElementById('matrixTable');
  tableEl.innerHTML = '';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const cornerTh = document.createElement('th');
  cornerTh.className = 'corner-header';
  cornerTh.innerHTML = '<b>세로: 4대 구간<br>＼ 가로: 오픈 단계</b>';
  headRow.appendChild(cornerTh);

  boardData.columns.forEach(col => {
    const colCount = boardData.cards.filter(c => c.col === col.id).length;
    const th = document.createElement('th');
    th.className = 'col-header';
    th.innerHTML = `
      <span class="col-count">${colCount}개</span>
      <h2>${col.title}</h2>
      <p>${col.subtitle}</p>
    `;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  tableEl.appendChild(thead);

  const tbody = document.createElement('tbody');
  boardData.rows.forEach(row => {
    const tr = document.createElement('tr');

    const rowTd = document.createElement('td');
    rowTd.className = 'row-header';
    const addBtnHtml = IS_EDITOR
      ? `<button class="row-add-btn" onclick="addNewCard('${row.id}')">+ 이 구간에 카드 추가</button>`
      : '';
    rowTd.innerHTML = `
      <h3>${row.title}</h3>
      <p>${row.subtitle}</p>
      ${addBtnHtml}
    `;
    tr.appendChild(rowTd);

    boardData.columns.forEach(col => {
      const td = document.createElement('td');
      td.className = 'cell';
      const dz = document.createElement('div');
      dz.className = 'dropzone';
      dz.dataset.col = col.id;
      dz.dataset.row = row.id;

      if (IS_EDITOR) {
        dz.addEventListener('dragover', e => {
          e.preventDefault();
          dz.classList.add('drag-over');
        });
        dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
        dz.addEventListener('drop', e => {
          e.preventDefault();
          dz.classList.remove('drag-over');
          if (!draggedCardId) return;
          const card = boardData.cards.find(c => c.id === draggedCardId);
          if (card) {
            const afterElement = getDragAfterElement(dz, e.clientY);
            card.col = col.id;
            card.row = row.id;
            boardData.cards = boardData.cards.filter(c => c.id !== draggedCardId);
            if (afterElement == null) {
              boardData.cards.push(card);
            } else {
              const targetIdx = boardData.cards.findIndex(c => c.id === afterElement.dataset.id);
              boardData.cards.splice(targetIdx, 0, card);
            }
            renderMatrix();
            saveBoard();
          }
        });
      }

      const cellCards = boardData.cards.filter(c => c.col === col.id && c.row === row.id);
      cellCards.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = `card stage-${card.orig_stage || 'pool'}` + (IS_EDITOR ? ' editable' : '');
        cardEl.draggable = IS_EDITOR;
        cardEl.dataset.id = card.id;

        const isMovedStage = card.orig_stage && card.orig_stage !== card.col;
        const isMovedRow = card.orig_row && card.orig_row !== card.row;
        let movedHtml = '';
        if (isMovedStage || isMovedRow) {
          movedHtml = `<span class="moved-badge">🚚 ${STAGE_NAMES[card.orig_stage] || '여유함'} ➔ 이동됨</span>`;
        }

        const ceAttr = IS_EDITOR ? 'contenteditable="true" spellcheck="false"' : '';
        const delBtnHtml = IS_EDITOR
          ? `<div class="card-actions"><button class="btn-del" title="삭제" onclick="deleteCard('${card.id}')">✕</button></div>`
          : '';

        cardEl.innerHTML = `
          <div class="card-top">
            <span class="card-cat" ${ceAttr}>${card.cat}</span>
            ${movedHtml}
          </div>
          <div class="card-title" ${ceAttr}>${card.title}</div>
          <div class="card-desc" ${ceAttr}>${card.desc}</div>
          ${delBtnHtml}
        `;

        if (IS_EDITOR) {
          cardEl.addEventListener('dragstart', () => {
            draggedCardId = card.id;
            cardEl.style.opacity = '0.4';
          });
          cardEl.addEventListener('dragend', () => {
            draggedCardId = null;
            cardEl.style.opacity = '1';
          });

          const catEl = cardEl.querySelector('.card-cat');
          const titleEl = cardEl.querySelector('.card-title');
          const descEl = cardEl.querySelector('.card-desc');

          catEl.addEventListener('blur', () => { card.cat = catEl.innerText.trim(); saveBoard(); });
          titleEl.addEventListener('blur', () => { card.title = titleEl.innerText.trim(); saveBoard(); });
          descEl.addEventListener('blur', () => { card.desc = descEl.innerText.trim(); saveBoard(); });
        }

        dz.appendChild(cardEl);
      });

      td.appendChild(dz);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  tableEl.appendChild(tbody);
}

function getDragAfterElement(container, y) {
  const draggableElements = [...container.querySelectorAll('.card')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function addNewCard(targetRowId) {
  if (!IS_EDITOR) return;
  const newId = 'c_' + Date.now();
  boardData.cards.unshift({
    id: newId,
    col: 'wave1',
    row: targetRowId || 'free',
    orig_stage: 'wave1',
    orig_row: targetRowId || 'free',
    cat: '✏️ 멀린님 직접작성',
    title: '새 기능 / 아이디어 제목 입력',
    desc: '클릭해서 내용을 직접 작성하세요'
  });
  renderMatrix();
  saveBoard();
}

function deleteCard(id) {
  if (!IS_EDITOR) return;
  if (!confirm('이 카드를 삭제할까요?')) return;
  boardData.cards = boardData.cards.filter(c => c.id !== id);
  renderMatrix();
  saveBoard();
}

fetchBoard();
if (!IS_EDITOR) {
  setInterval(() => fetchBoard(true), 5000);
}
</script>
</body>
</html>
